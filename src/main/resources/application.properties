spring.application.name=soa-lab3-product-service
# Independent port for Product Service
server.port=8081

# Independent H2 database for Product Service (productdb)
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Lab 2 Auth Service validation endpoint
auth.service.url=http://localhost:8080/auth
